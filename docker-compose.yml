services:
  slotmatrix_db:
    image: mariadb:11.4
    container_name: slotmatrix_db
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: slotmatrix_root
      MARIADB_DATABASE: slotmatrix
      MARIADB_USER: slotmatrix
      MARIADB_PASSWORD: slotmatrix
    ports:
      - "13308:3306"
    volumes:
      - slotmatrix_db_data:/var/lib/mysql
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  slotmatrix_redis:
    image: redis:7-alpine
    container_name: slotmatrix_redis
    restart: unless-stopped
    ports:
      - "16381:6379"
    volumes:
      - slotmatrix_redis_data:/data
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  slotmatrix_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: slotmatrix_api
    restart: unless-stopped
    depends_on:
      slotmatrix_db:
        condition: service_healthy
      slotmatrix_redis:
        condition: service_healthy
    environment:
      PORT: 18081
      DATABASE_URL: mysql://slotmatrix:slotmatrix@slotmatrix_db:3306/slotmatrix
      REDIS_URL: redis://slotmatrix_redis:6379
      JWT_SECRET: slotmatrix-production-grade-secret-key-2026
      BILLING_WEBHOOK_SECRET: whsec_slotmatrix_billing_secret_2026
      AUTO_SEED: "true"
    ports:
      - "18081:18081"
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  slotmatrix_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: slotmatrix_worker
    restart: unless-stopped
    command: ["npx", "tsx", "src/main-worker.ts"]
    depends_on:
      slotmatrix_api:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://slotmatrix:slotmatrix@slotmatrix_db:3306/slotmatrix
      REDIS_URL: redis://slotmatrix_redis:6379
      JWT_SECRET: slotmatrix-production-grade-secret-key-2026
      BILLING_WEBHOOK_SECRET: whsec_slotmatrix_billing_secret_2026
    networks:
      - slotmatrix_net

  slotmatrix_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: slotmatrix_web
    restart: unless-stopped
    depends_on:
      slotmatrix_api:
        condition: service_healthy
    ports:
      - "18174:80"
    networks:
      - slotmatrix_net

volumes:
  slotmatrix_db_data:
  slotmatrix_redis_data:

networks:
  slotmatrix_net:
    driver: bridge
