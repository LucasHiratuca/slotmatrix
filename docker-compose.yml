services:
  slotmatrix_db:
    image: mariadb:11.4
    container_name: slotmatrix_db
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?Defina MARIADB_ROOT_PASSWORD no .env}
      MARIADB_DATABASE: slotmatrix
      MARIADB_USER: slotmatrix
      MARIADB_PASSWORD: ${MARIADB_PASSWORD:?Defina MARIADB_PASSWORD no .env}
    ports:
      # Em produção, remova a exposição de porta externa e acesse apenas pela rede interna
      - "127.0.0.1:13308:3306"
    volumes:
      - slotmatrix_db_data:/var/lib/mysql
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20

  slotmatrix_redis:
    image: redis:7-alpine
    container_name: slotmatrix_redis
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}
      - --appendonly
      - "yes"
    ports:
      # Em produção, remova a exposição de porta externa
      - "127.0.0.1:16381:6379"
    volumes:
      - slotmatrix_redis_data:/data
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 20

  slotmatrix_api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: slotmatrix_api
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      slotmatrix_db:
        condition: service_healthy
      slotmatrix_redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 18081
      DATABASE_URL: mysql://slotmatrix:${MARIADB_PASSWORD:?Defina MARIADB_PASSWORD no .env}@slotmatrix_db:3306/slotmatrix
      REDIS_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@slotmatrix_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (>=24 chars) no .env}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?Defina BILLING_WEBHOOK_SECRET (>=24 chars) no .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:18174}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:18174}
      S3_ENDPOINT: ${S3_ENDPOINT:-http://garage_s3:3900}
      S3_REGION: ${S3_REGION:-garage}
      S3_BUCKET: ${S3_BUCKET:-clinic-docs}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-}
      S3_USE_SSL: ${S3_USE_SSL:-false}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
      AUTO_SEED: ${AUTO_SEED:-false}
      ENABLE_BILLING_SIMULATOR: ${ENABLE_BILLING_SIMULATOR:-false}
      ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    ports:
      - "18081:18081"
    networks:
      - slotmatrix_net
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:18081/api/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  slotmatrix_worker:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: slotmatrix_worker
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    command: ["npx", "tsx", "src/main-worker.ts"]
    depends_on:
      slotmatrix_api:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      DATABASE_URL: mysql://slotmatrix:${MARIADB_PASSWORD:?Defina MARIADB_PASSWORD no .env}@slotmatrix_db:3306/slotmatrix
      REDIS_URL: redis://:${REDIS_PASSWORD:?Defina REDIS_PASSWORD no .env}@slotmatrix_redis:6379
      JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET (>=24 chars) no .env}
      BILLING_WEBHOOK_SECRET: ${BILLING_WEBHOOK_SECRET:?Defina BILLING_WEBHOOK_SECRET (>=24 chars) no .env}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      APP_PUBLIC_URL: ${APP_PUBLIC_URL:-http://localhost:18174}
      ALLOW_LOCAL_WEBHOOKS: ${ALLOW_LOCAL_WEBHOOKS:-false}
    networks:
      - slotmatrix_net

  slotmatrix_web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: slotmatrix_web
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      slotmatrix_api:
        condition: service_healthy
    ports:
      - "18174:80"
    networks:
      - slotmatrix_net

volumes:
  slotmatrix_db_data:
  slotmatrix_redis_data:

networks:
  slotmatrix_net:
    driver: bridge
